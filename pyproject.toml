[project]
name = "travelicious-inventory"
version = "1.0.0"
description = "Inventory management application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.1.0",
    "Werkzeug>=3.1.0",
    "cryptography>=42.0.0",
    "Authlib>=1.3.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "libsql>=0.1.11",
]

[tool.vercel]
entrypoint = "app:app"

