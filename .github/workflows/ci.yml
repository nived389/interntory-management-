name: "CI and Tests"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          pytest -v

      - name: Verify App Initialization and Smoke Test
        run: |
          python -c "import app; c = app.app.test_client(); res = c.get('/'); assert res.status_code == 200; s = c.get('/api/session'); assert s.status_code == 200; assert 'csrf' in s.json; print('App smoke test passed!')"
