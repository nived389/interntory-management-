services:
  - type: web
    name: travelicious-inventory
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PASSWORD_VAULT_KEY
        sync: false
      - key: HTTPS
        value: '1'
      - key: TZ
        value: Asia/Kolkata
      - key: PYTHON_VERSION
        value: 3.12.0

